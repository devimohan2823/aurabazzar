    <section class="form-page">
        <div class="form-container shadow">
            <h2 id="form-title">Insurance Booking Request</h2>
            <p>Please provide your details below.</p>
            
            <form id="bookingForm" action="booking.php" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="userName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="userMobile" placeholder="e.g. 9999 999 999" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="userEmail" placeholder="name@email.com" required>
                </div>
                <div class="form-group">
                    <label>City / Living Place</label>
                    <input type="text" id="userLocation" placeholder="Chennai, Madurai, etc." required>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">Request a Call Back</button>
            </form>
        </div>
    </section>
